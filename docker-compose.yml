services:
  postgres:
    image: postgres:18
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
    ports:
      - "5433:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: taskflow-redis
    ports:
      - "6379:6379"

volumes:
  taskflow-postgres-data:
