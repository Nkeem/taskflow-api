server:
  port: 8080

spring:
  application:
    name: taskflow-api
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m
  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow_db
    username: taskflow_user
    password: taskflow_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
