server:
  port: 8080

spring:
  application:
    name: taskflow-api
  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow_db
    username: taskflow_user
    password: taskflow_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false
